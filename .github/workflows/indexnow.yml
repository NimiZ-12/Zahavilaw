# Submits recently changed Hebrew URLs to IndexNow (Bing & friends) after
# every successful production deploy. Vercel reports its deployments to
# GitHub because the project is Git-connected, which fires the
# deployment_status event. The IndexNow key is public by design, so this
# workflow needs no secrets.
name: IndexNow

on:
  deployment_status:
  # Manual run with a custom window, e.g. a one-time catch-up submission
  # (the agent environment cannot reach the IndexNow API directly).
  workflow_dispatch:
    inputs:
      since:
        description: "Submit URLs whose sitemap lastmod is on or after this date (YYYY-MM-DD)"
        required: true

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Default window: everything whose sitemap lastmod is within the
      # last two days - i.e. what this deploy (and at worst the one
      # before it) actually changed.
      - run: >-
          node scripts/indexnow.mjs
          ${{ github.event_name == 'workflow_dispatch' && format('--since {0}', inputs.since) || '' }}
